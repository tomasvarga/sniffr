# sniffr config — copy to ~/.config/sniffr/config.toml
#
# Chooses where the agent's findings are delivered. With NO config, sniffr uses
# the "tuicr" backend — so you only need this file to switch backends or add
# custom ones. Precedence: `--backend` flag > SNIFFR_BACKEND env > this file > tuicr.

# Built-in backends: "tuicr" (default) and "hunk".
backend = "tuicr"

# --- Review tuning ----------------------------------------------------------
# `prompt` customizes WHAT the agent looks for. sniffr always appends the
# machine-readable output contract itself, so DON'T describe the JSON format
# here — just the review focus/persona. Omit to use the shipped default in
# prompts/review.txt (a must-fix-only reviewer: bugs, security, concurrency,
# contracts, unhandled input/parse errors; reasons in context; no style nits —
# chosen by a multi-model vote + a bug-injection bake-off). The consensus merge
# prompt lives in prompts/consensus.txt (override via [consensus].prompt).
#
# prompt = """
# You are a security-focused reviewer. Prioritize auth, input validation, and
# secrets. Flag perf regressions. Ignore style and formatting entirely.
# """
# (SNIFFR_PROMPT env overrides this per-run.)
#
# max = 8   # cap on findings per review (SNIFFR_MAX env overrides)

# model = "gpt-5.6-codex-high"   # model for the agent (--model flag / SNIFFR_MODEL
#                           # env override; unset = the agent's own default/auto)

# --- Multi-agent consensus (optional) ---------------------------------------
# With several agents (--agent codex,claude,…) their findings overlap. Turn on
# consensus to MERGE them into one deduped comment per bug — stamped with which
# agents agreed (chips) and rewritten to good-review-comment standard — using a
# CHEAP model (the merge is "writing up", not deep reasoning). The review agents
# run in PARALLEL, then the cheap model merges. On when [consensus].model is set
# (or the --consensus flag / SNIFFR_CONSENSUS env).
# [consensus]
# model  = "claude-haiku-4-5"   # the cheap merge model
# agent  = "claude"             # CLI that runs the merge (default: first review agent)
# prompt = "..."               # override the built-in merge instruction (optional)

# --- Noise filters (optional) -----------------------------------------------
# Keep only findings at/above a severity and/or confidence. A finding missing the
# field is kept (never silently drops an unranked bug). Flags --min-severity /
# --min-confidence (and SNIFFR_MIN_SEVERITY / SNIFFR_MIN_CONFIDENCE) override.
# min_severity   = "high"       # critical | high | medium | low
# min_confidence = 0.6          # 0.0–1.0

# --- Custom backends --------------------------------------------------------
# Define your own review tool as a backend. sniffr resolves the agent's findings
# (a JSON array of {file, line, type, body}, line-anchored by content), then:
#   • runs `open`   to launch/point the viewer (optional)
#   • runs `inject` with the findings JSON piped to its stdin
# Placeholders expanded in both commands: {url} {repo} {num} {diff}
#   {diff} = path to the PR's unified-diff file
#
# Example — a reviewer that opens by URL and imports findings from stdin:
#
# [backends.myreviewr]
# open   = "myreviewr open {url}"
# inject = "myreviewr import --stdin"
#
# Example — no viewer, just write the findings to a sidecar file:
#
# [backends.sidecar]
# inject = "cat > /tmp/findings-{num}.json"
