[package]
name = "sniffr"
version = "0.4.0-dev"
edition = "2021"
description = "An AI sniffs your PR for issues before you review it — agent → line-anchored findings → your terminal reviewer (tuicr/hunk/custom) or JSON."
license = "MIT"
repository = "https://github.com/tomasvarga/sniffr"
readme = "README.md"

[[bin]]
name = "sniffr"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
anyhow = "1"
dirs = "5"
which = "6"
owo-colors = "4"

[profile.release]
strip = true
lto = "thin"
